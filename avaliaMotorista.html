<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Viagem</title>
    <style>
        /* Estilização Geral (Mantida conforme original) */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        h2 { color: #1a1a1b; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: #65676b; font-size: 0.95rem; margin-bottom: 25px; }

        .rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 20px;
        }

        .rating input { display: none; }

        .rating label {
            font-size: 3rem;
            color: #e4e6eb;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            padding: 0 5px;
        }

        .rating label:before { content: '★'; }

        .rating input:checked ~ label,
        .rating label:hover,
        .rating label:hover ~ label {
            color: #f5c330;
        }

        .rating label:active { transform: scale(1.2); }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #dddfe2;
            border-radius: 12px;
            resize: none;
            box-sizing: border-box;
            font-size: 1rem;
            margin-top: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus { border-color: #1877f2; }

        button {
            background-color: #000000;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: opacity 0.3s, transform 0.1s;
        }

        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #status-msg { 
            margin-top: 15px; 
            font-size: 0.9rem; 
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Avalie seu motorista</h2>
        <p class="subtitle">Sua opinião é fundamental para a nossa comunidade.</p>

        <div class="rating">
            <input type="radio" name="star" id="star5" value="5"><label for="star5" title="Excelente"></label>
            <input type="radio" name="star" id="star4" value="4"><label for="star4" title="Muito Bom"></label>
            <input type="radio" name="star" id="star3" value="3"><label for="star3" title="Bom"></label>
            <input type="radio" name="star" id="star2" value="2"><label for="star2" title="Regular"></label>
            <input type="radio" name="star" id="star1" value="1"><label for="star1" title="Ruim"></label>
        </div>

        <textarea id="comment" placeholder="Conte-nos mais sobre a viagem..."></textarea>

        <button id="submitBtn">Finalizar Avaliação</button>
        <p id="status-msg"></p>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-msg');
        const commentField = document.getElementById('comment');
        
        // URLs
        const checkUrl = 'https://primary-production-a103.up.railway.app/webhook/055eef49-5e20-4f65-9212-a5927d82b7eb';
        const submitUrl = 'https://primary-production-a103.up.railway.app/webhook/55e6aaac-fc95-419c-9578-50115ffa6e02';

        // Captura o corridaId da URL
        const urlParams = new URLSearchParams(window.location.search);
        const corridaId = urlParams.get('corridaId');

        // 1. Lógica de Busca ao iniciar
        window.onload = async () => {
            if (!corridaId) return;

            try {
                const response = await fetch(`${checkUrl}?corridaId=${corridaId}`);
                
                if (response.ok) {
                    const data = await response.json();

                    // Se retornar um objeto com dados (existe avaliação)
                    if (data && data.rating) {
                        // Popular campos
                        document.getElementById(`star${data.rating}`).checked = true;
                        commentField.value = data.feedback || "";
                        
                        // Desabilitar tudo
                        disableForm("Esta corrida já foi avaliada.");
                    }
                }
            } catch (error) {
                console.error("Erro ao verificar avaliação existente:", error);
            }
        };

        function disableForm(message) {
    submitBtn.disabled = true;
    submitBtn.innerText = "Avaliação Concluída";
    commentField.disabled = true;
    
    // Ajuste da cor para manter a fidelidade do site (#65676b)
    statusMsg.style.color = '#65676b'; 
    statusMsg.style.fontWeight = '500';
    statusMsg.innerText = message;
    
    // Desabilita os inputs de estrela
    document.querySelectorAll('input[name="star"]').forEach(input => input.disabled = true);
}

        // 2. Lógica de Envio (Mantida com pequenas melhorias)
        submitBtn.addEventListener('click', async () => {
            const stars = document.querySelector('input[name="star"]:checked');
            const comment = commentField.value;

            if (!stars) {
                statusMsg.style.color = '#d93025';
                statusMsg.innerText = "Por favor, selecione uma quantidade de estrelas.";
                return;
            }

            const payload = {
                corridaId: corridaId,
                rating: parseInt(stars.value),
                feedback: comment,
                timestamp: new Date().toISOString(),
                origem: window.location.href
            };

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Enviando...";

                const response = await fetch(submitUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    disableForm("Obrigado! Avaliação enviada com sucesso.");
                    submitBtn.innerText = "Enviado!";
                } else {
                    throw new Error('Falha no envio');
                }
            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Finalizar Avaliação";
                statusMsg.style.color = '#d93025';
                statusMsg.innerText = "Erro ao conectar. Verifique sua internet.";
            }
        });
    </script>
</body>
</html>
