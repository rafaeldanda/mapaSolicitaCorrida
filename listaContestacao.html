<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento | Me Leva</title>

    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css' rel='stylesheet' />

    <style>
        body { font-family: sans-serif; margin:0; background:#f5f7fa; }
        .container { max-width:600px; margin:auto; padding:20px; }
        .card { background:white; padding:15px; border-radius:10px; margin-bottom:15px; }
        .map-wrapper { width:100%; height:200px; border-radius:10px; overflow:hidden; background:#ddd; margin-top:10px; }
    </style>
</head>
<body>

<div class="container" id="lista-container">
    Carregando...
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoicmFmYWVsZGFuZGEiLCJhIjoiY21tM3V6aHQ3MDR1dTJxcHdiNnhpaHd0ayJ9.w-fjeHmzlyVes75Rg4pJuQ';

// 🔥 converte endereço em coordenada
async function geocodificar(endereco) {
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?access_token=${mapboxgl.accessToken}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.features || !data.features.length) return null;

    return data.features[0].center; // [lng, lat]
}

const URL_LISTA = 'https://primary-production-a103.up.railway.app/webhook/d2494948-3dd8-40ed-a262-b4cef2d5c814';

async function carregarDados() {
    const res = await fetch(URL_LISTA);
    const lista = await res.json();

    const container = document.getElementById('lista-container');
    container.innerHTML = '';

    for (let i = 0; i < lista.length; i++) {
        const item = lista[i];
        const mapId = `map-${i}`;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <div><b>Corrida:</b> ${item.corridaId}</div>
            <div><b>Origem:</b> ${item.origem}</div>
            <div><b>Destino:</b> ${item.destino}</div>
            <div id="${mapId}" class="map-wrapper"></div>
        `;

        container.appendChild(card);

        // espera renderizar o DOM
        setTimeout(async () => {
            try {
                const origem = await geocodificar(item.origem + ", Porto Alegre");
                const destino = await geocodificar(item.destino + ", Porto Alegre");

                if (!origem || !destino) {
                    console.warn("Erro ao geocodificar:", item);
                    return;
                }

                const map = new mapboxgl.Map({
                    container: mapId,
                    style: 'mapbox://styles/mapbox/streets-v12',
                    center: origem,
                    zoom: 12
                });

                new mapboxgl.Marker({color:'#2ea6ff'}).setLngLat(origem).addTo(map);
                new mapboxgl.Marker({color:'#ef4444'}).setLngLat(destino).addTo(map);

                const bounds = new mapboxgl.LngLatBounds()
                    .extend(origem)
                    .extend(destino);

                map.fitBounds(bounds, { padding: 40 });

            } catch (err) {
                console.error("Erro mapa:", err);
            }
        }, 500);
    }
}

carregarDados();
</script>

</body>
</html>
