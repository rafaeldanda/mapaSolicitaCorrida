<script>
mapboxgl.accessToken = 'SEU_TOKEN_AQUI';

const URL_LISTA = 'https://primary-production-a103.up.railway.app/webhook/d2494948-3dd8-40ed-a262-b4cef2d5c814';

async function geocodificar(endereco) {
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?access_token=${mapboxgl.accessToken}`;

    const res = await fetch(url);
    const data = await res.json();

    if (!data.features || data.features.length === 0) return null;

    return data.features[0].center; // [lng, lat]
}

async function carregarDados() {
    const res = await fetch(URL_LISTA);
    const lista = await res.json();

    const container = document.getElementById('lista-container');
    container.innerHTML = '';

    for (let index = 0; index < lista.length; index++) {
        const item = lista[index];
        const mapId = `map-${index}`;

        const card = document.createElement('div');
        card.innerHTML = `
            <div style="background:#fff; padding:15px; border-radius:10px; margin-bottom:15px;">
                <div><b>${item.corridaId}</b></div>
                <div>${item.origem} → ${item.destino}</div>
                <div id="${mapId}" style="height:200px; margin-top:10px;"></div>
            </div>
        `;

        container.appendChild(card);

        try {
            const origem = await geocodificar(item.origem + ", Porto Alegre");
            const destino = await geocodificar(item.destino + ", Porto Alegre");

            if (!origem || !destino) {
                console.warn("Não encontrou coordenadas");
                continue;
            }

            const map = new mapboxgl.Map({
                container: mapId,
                style: 'mapbox://styles/mapbox/streets-v12',
                center: origem,
                zoom: 12
            });

            new mapboxgl.Marker({color:'#2ea6ff'}).setLngLat(origem).addTo(map);
            new mapboxgl.Marker({color:'#ef4444'}).setLngLat(destino).addTo(map);

            const bounds = new mapboxgl.LngLatBounds()
                .extend(origem)
                .extend(destino);

            map.fitBounds(bounds, { padding: 40 });

        } catch (err) {
            console.error("Erro mapa:", err);
        }
    }
}

carregarDados();
</script>
