<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Atendimento | Me Leva</title>

<script src='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js'></script>
<link href='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css' rel='stylesheet' />

<style>
:root { --primary:#2ea6ff; --success:#10b981; --text:#333; --bg:#f5f7fa; --danger:#ef4444; --warning:#f59e0b; }
body { margin:0; font-family:sans-serif; background:var(--bg); }
.container { max-width:550px; margin:auto; padding:20px; }
.card { background:#fff; border-radius:12px; padding:15px; margin-bottom:20px; }
.map-wrapper { width:100%; height:180px; border-radius:10px; overflow:hidden; background:#eee; }
</style>
</head>

<body>

<div class="container" id="lista-container">
Carregando...
</div>

<script>

// 🔥 nunca mais tela branca
window.onerror = function(msg, url, line) {
    console.error("ERRO GLOBAL:", msg, "linha:", line);
};

mapboxgl.accessToken = 'pk.eyJ1IjoicmFmYWVsZGFuZGEiLCJhIjoiY21tM3V6aHQ3MDR1dTJxcHdiNnhpaHd0ayJ9.w-fjeHmzlyVes75Rg4pJuQ';

const URL_LISTA = 'https://primary-production-a103.up.railway.app/webhook/d2494948-3dd8-40ed-a262-b4cef2d5c814';

// 🔥 converte endereço em coordenada
async function geocodificar(endereco) {
    try {
        const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?access_token=${mapboxgl.accessToken}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.features || !data.features.length) return null;

        return data.features[0].center;
    } catch {
        return null;
    }
}

async function carregarDados() {
    try {
        const res = await fetch(URL_LISTA);
        const dados = await res.json();

        if (!dados) throw new Error("Sem dados");

        renderizarLista(Array.isArray(dados) ? dados : [dados]);

    } catch (e) {
        console.error(e);
        document.getElementById('lista-container').innerHTML =
        '<div style="padding:40px;text-align:center;color:red;">Erro ao carregar</div>';
    }
}

function renderizarLista(lista) {
    const container = document.getElementById('lista-container');
    container.innerHTML = '';

    lista.forEach((item, index) => {
        const mapId = `map-${index}`;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <div><b>Corrida:</b> ${item.corridaId}</div>
            <div>${item.origem} → ${item.destino}</div>
            <div id="${mapId}" class="map-wrapper"></div>
        `;

        container.appendChild(card);

        // mapa seguro (não quebra nada)
        setTimeout(async () => {
            try {
                const origem = await geocodificar(item.origem + ", Porto Alegre");
                const destino = await geocodificar(item.destino + ", Porto Alegre");

                if (!origem || !destino) return;

                const map = new mapboxgl.Map({
                    container: mapId,
                    style: 'mapbox://styles/mapbox/streets-v12',
                    center: origem,
                    zoom: 12
                });

                new mapboxgl.Marker({color:'#2ea6ff'}).setLngLat(origem).addTo(map);
                new mapboxgl.Marker({color:'#ef4444'}).setLngLat(destino).addTo(map);

                const bounds = new mapboxgl.LngLatBounds()
                    .extend(origem)
                    .extend(destino);

                map.fitBounds(bounds, { padding: 40 });

            } catch (e) {
                console.error("Erro mapa:", e);
            }
        }, 500);
    });
}

carregarDados();

</script>

</body>
</html>
