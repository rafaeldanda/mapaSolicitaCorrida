<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Corrida</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root { --primary: #2ea6ff; --success: #10b981; --text: #333; --bg: #f5f7fa; --danger: #ef4444; --label: #64748b; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .header { background: white; padding: 15px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 16px; margin: 0; color: var(--primary); }
        #map { width: 100%; height: 220px; background: #ddd; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; background: #e1fdec; color: var(--success); margin-bottom: 8px; }
        .route-info { position: relative; padding-left: 25px; }
        .route-info::before { content: ''; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 1px; background: #ddd; }
        .dot { position: absolute; left: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid white; }
        .dot.dest { background: #ffaa00; bottom: 8px; top: auto; }
        .address-box { margin-bottom: 15px; }
        .address-box label { font-size: 10px; color: #888; display: block; }
        .address-box p { margin: 3px 0; font-size: 13px; font-weight: 500; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px; }
        .detail-item label { font-size: 10px; color: #888; display: block; }
        .detail-item span { font-size: 14px; font-weight: bold; }
        .driver-card { display: flex; align-items: center; gap: 12px; }
        .driver-photo { width: 40px; height: 40px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .driver-info h3 { margin: 0; font-size: 14px; }
        .driver-info p { margin: 1px 0; font-size: 11px; color: #666; }
        
        /* Estilos de Contestação e Resposta */
        .contest-title { font-size: 13px; font-weight: bold; margin-bottom: 12px; color: var(--danger); display: block; }
        .form-group { margin-bottom: 12px; }
        .form-group label { font-size: 10px; color: #888; display: block; margin-bottom: 4px; }
        select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 13px; box-sizing: border-box; }
        textarea { resize: none; height: 70px; }
        .btn-submit { width: 100%; background: var(--danger); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .success-msg { color: #00a86b; font-weight: bold; font-size: 18px; text-align: center; margin: 10px 0; width: 100%; }
        
        /* Card de Resposta do Suporte */
        .support-response { border-left: 4px solid var(--primary); padding-left: 15px; }
        .label-caps { font-size: 10px; font-weight: 800; color: var(--label); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; display: block; }
        .response-text { font-size: 13px; line-height: 1.5; color: var(--text); margin-bottom: 12px; }

        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:1000; display:flex; align-items:center; justify-content:center; font-size: 14px; }
    </style>
</head>
<body>

<div id="loading-overlay">Carregando...</div>

<div class="header">
    <h1 id="titulo-id">Corrida</h1>
</div>

<div id="map"></div>

<div class="container">
    <div class="card">
        <div class="status-badge" id="status-tag">---</div>
        <div class="route-info">
            <div class="dot"></div>
            <div class="address-box"><label>ORIGEM</label><p id="origem-txt">---</p></div>
            <div class="dot dest"></div>
            <div class="address-box"><label>DESTINO</label><p id="destino-txt">---</p></div>
        </div>
        <div class="details-grid">
            <div class="detail-item"><label>DISTÂNCIA</label><span id="distancia">---</span></div>
            <div class="detail-item"><label>VALOR PAGO</label><span id="valor" style="color: var(--success)">---</span></div>
        </div>
    </div>

    <div class="card">
        <label style="font-size: 10px; color: #888; margin-bottom: 8px; display: block;">MOTORISTA E VEÍCULO</label>
        <div class="driver-card">
            <div class="driver-photo">👤</div>
            <div class="driver-info">
                <h3 id="motorista-nome">---</h3>
                <p id="veiculo-info">---</p>
                <p id="motorista-pix" style="font-size: 10px; color: var(--primary);">---</p>
            </div>
        </div>
    </div>

    <div class="card" id="card-contestacao" style="display:none;">
        <div id="conteudo-dinamico">
            <span class="contest-title">Contestar esta corrida</span>
            <div class="form-group">
                <label>MOTIVO DA RECLAMAÇÃO</label>
                <select id="motivo-select">
                    <option value="Valor Incorreto">Valor diferente do estimado</option>
                    <option value="Rota Ineficiente">Rota ineficiente</option>
                    <option value="Conduta/Segurança">Conduta/Segurança</option>
                    <option value="Taxa Indevida">Taxa indevida</option>
                    <option value="Outros">Outro motivo</option>
                </select>
            </div>
            <div class="form-group">
                <label>DETALHES (OPCIONAL)</label>
                <textarea id="desc-contestacao" placeholder="Descreva brevemente..."></textarea>
            </div>
            <button id="btn-envio" class="btn-submit" onclick="enviarContestacao()">Enviar Contestação</button>
        </div>
    </div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoicmFmYWVsZGFuZGEiLCJhIjoiY21tM3V6aHQ3MDR1dTJxcHdiNnhpaHd0ayJ9.w-fjeHmzlyVes75Rg4pJuQ';
    const urlParams = new URLSearchParams(window.location.search);
    const corridaId = urlParams.get('id');
    let dadosCorridaGlobal = null;

    if (!corridaId) {
        document.getElementById('loading-overlay').innerText = "ID ausente.";
    } else {
        buscarDados();
    }

    async function buscarDados() {
        try {
            // 1. Busca dados da corrida
            const response = await fetch(`https://primary-production-a103.up.railway.app/webhook/6516ef89-ec52-4713-8229-5874ecef74a6?id=${corridaId}`);
            const data = await response.json();
            dadosCorridaGlobal = Array.isArray(data) ? data[0] : data;
            
            if (dadosCorridaGlobal) {
                renderizarInterface(dadosCorridaGlobal);
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('card-contestacao').style.display = 'block';

                // 2. Busca se já existe uma resposta do suporte
                await buscarRespostaSuporte();
            }
        } catch (error) {
            document.getElementById('loading-overlay').innerText = "Erro ao carregar.";
        }
    }

    async function buscarRespostaSuporte() {
        try {
            // Buscando os dados completos da contestação (onde está a resposta)
            const res = await fetch(`https://primary-production-a103.up.railway.app/webhook/fb5e433b-fedc-4f6f-b5b8-7297098da150?id=${corridaId}`);
            if (res.ok) {
                const dados = await res.json();
                // O n8n costuma retornar um array ou objeto único, tratamos aqui:
                const item = Array.isArray(dados) ? dados[0] : dados;

                // Regra: Se houver resposta do suporte, exibe o card azul
                if (item && item.respostaSuporte) {
                    const dataFormatada = item.dataResposta ? new Date(item.dataResposta).toLocaleString('pt-BR') : '';
                    exibirRespostaSuporte(item.respostaSuporte, dataFormatada);
                } 
                // Se não tiver resposta mas o status for "contestada", mostra a msg de aguardo
                else if (dadosCorridaGlobal.status.toLowerCase().includes("contest") || 
                         (item.status && item.status.toLowerCase().includes("contest"))) {
                    exibirMensagemSucesso();
                }
            }
        } catch (e) {
            console.log("Ainda não há contestação ou resposta vinculada.");
        }
    }

    function renderizarInterface(dados) {
        const idCurto = dados.corridaId.split('-')[1] || 'Detalhes';
        document.getElementById('titulo-id').innerText = `Corrida #${idCurto}`;
        
        // Normaliza o status para comparação (remove espaços e coloca em minúsculo)
        const statusAtual = dados.status ? dados.status.toLowerCase().trim() : "";
        document.getElementById('status-tag').innerText = dados.status;

        // REGRA DE NEGÓCIO: Se já estiver contestada, bloqueia o formulário imediatamente
        if (statusAtual === "contestada" || statusAtual.includes("respond")) {
            exibirMensagemSucesso();
        }

        document.getElementById('origem-txt').innerText = dados.origem;
        document.getElementById('destino-txt').innerText = dados.destino;
        document.getElementById('distancia').innerText = `${dados.distanciaPassageiro} km`;
        document.getElementById('valor').innerText = `R$ ${parseFloat(dados.valorTotal).toFixed(2).replace('.', ',')}`;
        document.getElementById('motorista-nome').innerText = dados.motorista.nome;
        document.getElementById('veiculo-info').innerText = `${dados.motorista.carro.modelo} • ${dados.motorista.carro.placa}`;
        document.getElementById('motorista-pix').innerText = `PIX: ${dados.motorista.pix}`;

        // ... (resto do código do mapa permanece igual)
        const pOrigem = [dados.rota.coords.origem[0], dados.rota.coords.origem[1]];
        const pDestino = [dados.rota.coords.destino[0], dados.rota.coords.destino[1]];
        const map = new mapboxgl.Map({
            container: 'map', style: 'mapbox://styles/mapbox/light-v11',
            center: pOrigem, zoom: 14
        });
        map.on('load', () => {
            new mapboxgl.Marker({ color: '#2ea6ff', scale: 0.8 }).setLngLat(pOrigem).addTo(map);
            new mapboxgl.Marker({ color: '#ffaa00', scale: 0.8 }).setLngLat(pDestino).addTo(map);
            const bounds = new mapboxgl.LngLatBounds().extend(pOrigem).extend(pDestino);
            map.fitBounds(bounds, { padding: 40, maxZoom: 15 });
        });
    }

    function exibirMensagemSucesso() {
        const container = document.getElementById('conteudo-dinamico');
        container.innerHTML = `
            <div style="text-align: center; padding: 10px 0;">
                <p class="success-msg" style="color: var(--primary); font-size: 16px;">Contestação em Análise</p>
                <p style="font-size: 12px; color: #888; margin-top: 5px;">
                    Já recebemos sua solicitação. <br> O suporte está analisando o caso e responderá em breve.
                </p>
            </div>
        `;
    }

    function exibirRespostaSuporte(texto, data) {
        const container = document.getElementById('conteudo-dinamico');
        container.innerHTML = `
            <div class="support-response">
                <span class="label-caps" style="color: var(--primary);">📩 Resposta do Suporte</span>
                <div class="response-text" style="font-weight: 500; margin-top: 5px;">${texto}</div>
                <div class="detail-item" style="margin-top: 10px; border-top: 1px dashed #eee; padding-top: 8px;">
                    <label>DATA DA SOLUÇÃO</label>
                    <span style="font-size:11px; font-weight: normal; color: #888;">${data || 'Recém respondido'}</span>
                </div>
            </div>
            <p style="text-align:center; font-size:11px; color:var(--success); font-weight:bold; margin-top:15px;">
                ✓ Solicitação Finalizada
            </p>
        `;
    }

    async function enviarContestacao() {
        const btn = document.getElementById('btn-envio');
        try {
            btn.disabled = true;
            btn.innerText = "Enviando...";

            const payload = {
                "corridaId": dadosCorridaGlobal.corridaId,
                "origem": dadosCorridaGlobal.origem,
                "destino": dadosCorridaGlobal.destino,
                "valorTotal": dadosCorridaGlobal.valorTotal,
                "motorista": dadosCorridaGlobal.motorista.nome,
                "passageiro": {
                    "nome": dadosCorridaGlobal.passageiro?.nome || "Não informado",
                    "id": dadosCorridaGlobal.passageiro?.id || "N/A",
                    "telefone": dadosCorridaGlobal.passageiro?.telefone || ""
                },
                "contestacao": {
                    "motivo": document.getElementById('motivo-select').value,
                    "detalhes": document.getElementById('desc-contestacao').value,
                    "dataEnvio": new Date().toISOString()
                }
            };

            const response = await fetch('https://primary-production-a103.up.railway.app/webhook/efcac4fb-e6f8-40c5-b381-42c4c9db6b81', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                exibirMensagemSucesso();
            } else {
                throw new Error();
            }
        } catch (error) {
            alert("Erro ao enviar contestação.");
            btn.disabled = false;
            btn.innerText = "Enviar Contestação";
        }
    }
</script>
</body>
</html>
