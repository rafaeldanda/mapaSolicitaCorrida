<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Centro de Comando</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root { --primary: #2ea6ff; --success: #10b981; --warning: #ffaa00; --danger: #ef4444; --dark: #1a1c23; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0d11; color: white; overflow: hidden; }

        /* Busca no Topo */
        .topbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            width: 90%; max-width: 700px; display: flex; gap: 10px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .search-input { flex: 1; padding: 10px; border: none; border-radius: 8px; background: rgba(0,0,0,0.3); color: white; outline: none; }
        .btn-search { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Mapa */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* Painel Lateral */
        .stats-panel {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background: rgba(26, 28, 35, 0.9); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 220px;
        }
        .stat-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.busy { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .dot.pending { background: var(--warning); box-shadow: 0 0 10px var(--warning); }

        #loader { position: fixed; top: 20px; right: 20px; z-index: 2000; background: var(--success); color: white; padding: 5px 15px; border-radius: 20px; font-size: 11px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="loader">LIVE</div>

<div class="topbar">
    <input type="text" id="queryBusca" class="search-input" placeholder="Buscar Corrida, CPF ou Nome...">
    <button class="btn-search" onclick="filtrarMapa()">BUSCAR</button>
</div>

<div id="map"></div>

<div class="stats-panel">
    <div class="stat-item"><div class="dot active"></div> Motoristas Online: <span id="count-livre">0</span></div>
    <div class="stat-item"><div class="dot busy"></div> Em Corrida: <span id="count-ocupado">0</span></div>
    <div class="stat-item"><div class="dot pending"></div> Chamadas Abertas: <span id="count-espera">0</span></div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoicmFmYWVsZGFuZGEiLCJhIjoiY21tM3V6aHQ3MDR1dTJxcHdiNnhpaHd0ayJ9.w-fjeHmzlyVes75Rg4pJuQ';
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [-51.209, -30.085], // Foco em Porto Alegre
        zoom: 12
    });

    let markers = [];
    let circleLayers = [];

    async function fetchData() {
        document.getElementById('loader').style.display = 'block';
        try {
            const response = await fetch('https://primary-production-a103.up.railway.app/webhook/332ac826-ee61-4613-b47e-f861512d035f');
            const data = await response.json();
            atualizarMapa(data);
        } catch (error) {
            console.error("Erro na atualização:", error);
        }
        setTimeout(() => document.getElementById('loader').style.display = 'none', 2000);
    }

    function atualizarMapa(dados) {
        // Limpar mapa anterior
        markers.forEach(m => m.remove());
        markers = [];
        circleLayers.forEach(id => {
            if (map.getLayer(id)) map.removeLayer(id);
            if (map.getSource(id)) map.removeSource(id);
        });
        circleLayers = [];

        // 1. Motoristas Online (Verde)
        dados.online.forEach((m, i) => renderizarPonto(m.location.coordinates, "#10b981", `Motorista: ${m.nome}<br>Status: Disponível`, `on-${i}`));

        // 2. Motoristas em Corrida (Vermelho)
        dados.em_corrida.forEach((m, i) => renderizarPonto(m.location.coordinates, "#ef4444", `Motorista: ${m.nome}<br>Status: Em Corrida`, `busy-${i}`));

        // 3. Corridas Solicitadas (Laranja) - Usa location_origem
        dados.solicitadas.forEach((c, i) => renderizarPonto(c.location_origem.coordinates, "#ffaa00", `Passageiro: ${c.passageiro.nome}<br>Destino: ${c.destino}`, `req-${i}`));

        // Atualizar Contadores
        document.getElementById('count-livre').innerText = dados.online.length;
        document.getElementById('count-ocupado').innerText = dados.em_corrida.length;
        document.getElementById('count-espera').innerText = dados.solicitadas.length;
    }

    function renderizarPonto(coords, cor, html, id) {
        const marker = new mapboxgl.Marker({ color: cor })
            .setLngLat(coords)
            .setPopup(new mapboxgl.Popup().setHTML(html))
            .addTo(map);
        markers.push(marker);

        // Raio de 5km aproximado visualmente
        const srcId = `src-${id}`;
        map.addSource(srcId, { "type": "geojson", "data": { "type": "Feature", "geometry": { "type": "Point", "coordinates": coords } } });
        map.addLayer({
            "id": `lyr-${id}`, "type": "circle", "source": srcId,
            "paint": { "circle-radius": 60, "circle-color": cor, "circle-opacity": 0.1, "circle-stroke-width": 1, "circle-stroke-color": cor }
        });
        circleLayers.push(`lyr-${id}`);
    }

    function filtrarMapa() {
        const valor = document.getElementById('queryBusca').value;
        alert("Filtrando por: " + valor);
    }

    map.on('load', () => {
        fetchData();
        setInterval(fetchData, 60000); // 1 minuto
    });
</script>
</body>
</html>
