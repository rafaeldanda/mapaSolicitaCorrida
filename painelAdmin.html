<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Live Tracking</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root { --primary: #2ea6ff; --success: #10b981; --warning: #ffaa00; --danger: #ef4444; }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #0b0d11; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* BARRA DE BUSCA REATIVADA */
        .topbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            width: 90%; max-width: 600px; display: flex; gap: 10px; background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .search-input { flex: 1; padding: 12px; border: none; border-radius: 10px; background: rgba(0,0,0,0.5); color: white; outline: none; font-size: 14px; }
        .btn-search { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { background: #1a94f0; transform: scale(1.02); }

        /* PAINEL DE LEGENDA */
        .stats-panel {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background: rgba(20, 22, 28, 0.95); padding: 20px; border-radius: 15px; width: 240px; border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 13px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
        .dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.busy { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .dot.pending { background: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .stat-count { font-weight: 800; font-size: 18px; }
    </style>
</head>
<body>

<div class="topbar">
    <input type="text" id="queryBusca" class="search-input" placeholder="Buscar Nome, CPF ou Placa...">
    <button class="btn-search" onclick="filtrarMapa()">BUSCAR</button>
</div>

<div id="map"></div>

<div class="stats-panel">
    <div class="stat-item"><span><i class="dot active"></i>Motoristas Livres</span><span class="stat-count" id="count-livre">0</span></div>
    <div class="stat-item"><span><i class="dot busy"></i>Em Corrida</span><span class="stat-count" id="count-ocupado">0</span></div>
    <div class="stat-item"><span><i class="dot pending"></i>Chamadas Abertas</span><span class="stat-count" id="count-espera">0</span></div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoicmFmYWVsZGFuZGEiLCJhIjoiY21tM3V6aHQ3MDR1dTJxcHdiNnhpaHd0ayJ9.w-fjeHmzlyVes75Rg4pJuQ';
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [-51.209, -30.085],
        zoom: 12
    });

    let markers = [];
    let layerIds = [];
    let ultimosDados = { online: [], em_corrida: [], solicitadas: [] };

    async function fetchData() {
        try {
            const response = await fetch('https://primary-production-a103.up.railway.app/webhook/332ac826-ee61-4613-b47e-f861512d035f');
            const res = await response.json();
            const dados = Array.isArray(res) ? res[0] : res;
            
            ultimosDados = dados; // Salva para a busca funcionar
            atualizarMapa(dados);
        } catch (e) { console.error("Erro ao carregar dados:", e); }
    }

    function atualizarMapa(dados) {
        markers.forEach(m => m.remove());
        markers = [];
        layerIds.forEach(id => {
            if (map.getLayer('lyr-'+id)) map.removeLayer('lyr-'+id);
            if (map.getSource('src-'+id)) map.removeSource('src-'+id);
        });
        layerIds = [];

        // 1. ONLINE (VERDE)
        (dados.online || []).forEach((m, i) => {
            renderizarPonto(m.location.coordinates, "#10b981", `<b>Motorista Livre</b><br>${m.nome}`, "on"+i);
        });

        // 2. EM CORRIDA (VERMELHO)
        (dados.em_corrida || []).forEach((c, i) => {
            const coords = c.location_origem ? c.location_origem.coordinates : (c.location ? c.location.coordinates : null);
            if(coords) renderizarPonto(coords, "#ef4444", `<b>Status:</b> ${c.status}`, "busy"+i);
        });

        // 3. SOLICITADAS (LARANJA)
        (dados.solicitadas || []).forEach((m, i) => {
            const coords = m.location ? m.location.coordinates : (m.location_origem ? m.location_origem.coordinates : null);
            if(coords) renderizarPonto(coords, "#ffaa00", `<b>Status:</b> ${m.status}`, "req"+i);
        });

        // ATUALIZAÇÃO DA LEGENDA
        document.getElementById('count-livre').innerText = (dados.online || []).length;
        document.getElementById('count-ocupado').innerText = (dados.em_corrida || []).length;
        document.getElementById('count-espera').innerText = (dados.solicitadas || []).length;
    }

    function renderizarPonto(coords, cor, html, id) {
        const marker = new mapboxgl.Marker({ color: cor })
            .setLngLat(coords)
            .setPopup(new mapboxgl.Popup().setHTML(html))
            .addTo(map);
        markers.push(marker);

        const sId = 'src-'+id;
        const lId = 'lyr-'+id;
        map.addSource(sId, { "type": "geojson", "data": { "type": "Feature", "geometry": { "type": "Point", "coordinates": coords } } });
        map.addLayer({
            "id": lId, "type": "circle", "source": sId,
            "paint": {
                "circle-radius": { 'base': 1.75, 'stops': [[10, 15], [12, 60], [15, 350]] },
                "circle-color": cor, "circle-opacity": 0.15, "circle-stroke-width": 1, "circle-stroke-color": cor
            }
        });
        layerIds.push(id);
    }

    function filtrarMapa() {
        const termo = document.getElementById('queryBusca').value.toLowerCase().trim();
        if (!termo) return;

        // Procura em todas as listas
        const todasAsListas = [...ultimosDados.online, ...ultimosDados.em_corrida, ...ultimosDados.solicitadas];
        
        const encontrado = todasAsListas.find(item => {
            const nome = (item.nome || "").toLowerCase();
            const cpf = (item.cpf || "").replace(/\D/g, '');
            const passageiro = (item.passageiro?.nome || "").toLowerCase();
            const placa = (item.carro?.placa || "").toLowerCase();
            return nome.includes(termo) || cpf.includes(termo.replace(/\D/g, '')) || passageiro.includes(termo) || placa.includes(termo);
        });

        if (encontrado) {
            const coords = encontrado.location ? encontrado.location.coordinates : encontrado.location_origem.coordinates;
            map.flyTo({ center: coords, zoom: 16, duration: 2000 });
        } else {
            alert("Nenhum registro encontrado.");
        }
    }

    map.on('load', () => {
        fetchData();
        setInterval(fetchData, 30000);
    });
</script>
</body>
</html>
