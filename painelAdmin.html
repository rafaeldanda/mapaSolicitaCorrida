<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Centro de Comando Real-Time</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root { --primary: #2ea6ff; --success: #10b981; --warning: #ffaa00; --danger: #ef4444; }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #0b0d11; color: white; overflow: hidden; }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        .topbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            width: 90%; max-width: 700px; display: flex; gap: 10px; background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
        }
        .search-input { flex: 1; padding: 12px; border: none; border-radius: 10px; background: rgba(0,0,0,0.5); color: white; outline: none; }
        .btn-search { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .stats-panel {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background: rgba(20, 22, 28, 0.95); padding: 20px; border-radius: 15px; width: 240px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stat-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 13px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
        .dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.busy { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .dot.pending { background: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .stat-count { font-weight: 800; font-size: 18px; color: #fff; min-width: 20px; text-align: right; }
    </style>
</head>
<body>

<div class="topbar">
    <input type="text" id="queryBusca" class="search-input" placeholder="ID Corrida, CPF ou Nome...">
    <button class="btn-search">BUSCAR</button>
</div>

<div id="map"></div>

<div class="stats-panel">
    <div class="stat-item"><span><i class="dot active"></i>Motoristas Livres</span><span class="stat-count" id="count-livre">0</span></div>
    <div class="stat-item"><span><i class="dot busy"></i>Em Corrida</span><span class="stat-count" id="count-ocupado">0</span></div>
    <div class="stat-item"><span><i class="dot pending"></i>Chamadas Abertas</span><span class="stat-count" id="count-espera">0</span></div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoicmFmYWVsZGFuZGEiLCJhIjoiY21tM3V6aHQ3MDR1dTJxcHdiNnhpaHd0ayJ9.w-fjeHmzlyVes75Rg4pJuQ';
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [-51.209, -30.085],
        zoom: 12,
        pitch: 30
    });

    let markers = [];
    let currentLayers = [];

    async function fetchData() {
        try {
            const response = await fetch('https://primary-production-a103.up.railway.app/webhook/332ac826-ee61-4613-b47e-f861512d035f');
            const resData = await response.json();
            
            // GARANTE A LEITURA DA GAVETA CORRETA (Fidelidade n8n)
            const dados = Array.isArray(resData) ? resData[0] : resData;
            
            atualizarMapa(dados);
        } catch (e) { console.error("Erro na busca de dados:", e); }
    }

    function atualizarMapa(dados) {
        // 1. Limpa marcadores visuais
        markers.forEach(m => m.remove());
        markers = [];
        
        // 2. Limpa camadas de círculos do Mapbox de forma segura
        currentLayers.forEach(id => {
            if (map.getLayer('lyr-' + id)) map.removeLayer('lyr-' + id);
            if (map.getSource('src-' + id)) map.removeSource('src-' + id);
        });
        currentLayers = [];

        // 3. Extrai listas com fallback para vazio []
        const online = dados.online || [];
        const emCorrida = dados.em_corrida || [];
        const solicitadas = dados.solicitadas || [];

        // 4. Renderiza Motoristas Online (Verde)
        online.forEach((m, i) => {
            renderizarPonto(m.location?.coordinates, "#10b981", `<b>Motorista Livre</b><br>${m.nome}`, "on-" + (m._id?.$oid || i));
        });

        // 5. Renderiza Motoristas em Corrida (Vermelho)
        emCorrida.forEach((m, i) => {
            renderizarPonto(m.location?.coordinates, "#ef4444", `<b>Em Corrida</b><br>${m.nome}`, "busy-" + (m._id?.$oid || i));
        });

        // 6. Renderiza Chamadas Pendentes (Laranja)
        solicitadas.forEach((c, i) => {
            const coords = c.location_origem?.coordinates || c.location?.coordinates;
            renderizarPonto(coords, "#ffaa00", `<b>Solicitada</b><br>${c.passageiro?.nome}`, "req-" + (c._id?.$oid || i));
        });

        // 7. ATUALIZAÇÃO DA LEGENDA (Corrigido para refletir o número real)
        document.getElementById('count-livre').innerText = online.length;
        document.getElementById('count-ocupado').innerText = emCorrida.length;
        document.getElementById('count-espera').innerText = solicitadas.length;
    }

    function renderizarPonto(coords, cor, popupHtml, idBase) {
        if (!coords || coords.length < 2) return; // Segurança contra dados nulos

        // Marcador
        const marker = new mapboxgl.Marker({ color: cor })
            .setLngLat(coords)
            .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(popupHtml))
            .addTo(map);
        markers.push(marker);

        // Gera ID único para não dar erro de "Source already exists"
        const uniqueId = idBase + "-" + Math.floor(Math.random() * 1000);
        const sId = 'src-' + uniqueId;
        const lId = 'lyr-' + uniqueId;
        
        map.addSource(sId, {
            "type": "geojson",
            "data": { "type": "Feature", "geometry": { "type": "Point", "coordinates": coords } }
        });

        map.addLayer({
            "id": lId,
            "type": "circle",
            "source": sId,
            "paint": {
                // Escala de 5km que aumenta/diminui com o Zoom
                "circle-radius": {
                    'base': 1.75,
                    'stops': [[10, 15], [12, 60], [15, 350], [20, 4000]]
                },
                "circle-color": cor,
                "circle-opacity": 0.18,
                "circle-stroke-width": 1,
                "circle-stroke-color": cor
            }
        });
        currentLayers.push(uniqueId);
    }

    map.on('load', () => {
        fetchData();
        setInterval(fetchData, 60000); // Atualiza de minuto em minuto
    });
</script>
</body>
</html>
