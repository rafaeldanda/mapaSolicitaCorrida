```
<h2>🚗 Motorista</h2>

<p>Token:</p>
<div id="token" class="token">...</div>

<div id="contador" class="contador">0</div>
<p>Sinais enviados</p>

<div id="led" class="led"></div>

<div id="log" class="log">Iniciando...</div>
```

</div>

<script>

// ================= CONFIG =================
const webhook = "https://primary-production-a103.up.railway.app/webhook/91e80c8e-2309-4dd4-8512-f0dc5c4af856";

// ================= TOKEN =================
const params = new URLSearchParams(window.location.search);
let token = params.get("token");

if (token) {
    localStorage.setItem("meleva_token", token);
} else {
    token = localStorage.getItem("meleva_token") || "SEM_TOKEN";
}

document.getElementById("token").innerText = token;

// ================= UI =================
function log(msg) {
    console.log(msg);
    document.getElementById("log").innerText = msg;
}

function blink() {
    const led = document.getElementById("led");
    led.classList.add("ativo");
    setTimeout(() => led.classList.remove("ativo"), 500);
}

// ================= ENVIO =================
let contador = 0;
let ultimoEnvio = 0;

async function enviar(lat, lon, speed = 0) {

    const agora = Date.now();

    // intervalo 60s
    if (agora - ultimoEnvio < 5000) return;

    ultimoEnvio = agora;

    const url = `${webhook}?token=${token}&lat=${lat}&lon=${lon}&speed=${speed}&ping=${contador+1}`;

    try {
        const res = await fetch(url);
        const text = await res.text();

        console.log("Servidor:", text);

        contador++;
        document.getElementById("contador").innerText = contador;

        log("✔ Enviado");
        blink();

    } catch (e) {
        console.error(e);
        log("❌ Erro: " + e.message);
    }
}

// ================= GPS =================
function iniciarGPS() {

    if (!navigator.geolocation) {
        log("GPS não suportado");
        return;
    }

    navigator.geolocation.watchPosition(
        (pos) => {
            const { latitude, longitude, speed } = pos.coords;

            console.log("GPS:", latitude, longitude);

            log("📍 GPS ativo");

            enviar(latitude, longitude, speed);
        },
        (err) => {
            log("Erro GPS: " + err.code);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 20000
        }
    );
}

// ================= PERMISSÃO =================
navigator.permissions.query({ name: "geolocation" }).then(result => {

    console.log("Permissão:", result.state);

    if (result.state === "denied") {
        log("❌ Permissão negada");
    } else {
        iniciarGPS();
    }

});

// ================= TESTE SEM GPS =================

// ================= SERVICE WORKER =================
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

</script>
