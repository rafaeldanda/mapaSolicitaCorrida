<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me Leva - Motorista</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ea6ff">
    <style>
        body { font-family: Arial; background: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 2px solid transparent; transition: 0.3s; }
        .contador { font-size: 3em; color: #2ea6ff; }
        .led { width: 12px; height: 12px; background: #ccc; border-radius: 50%; margin: 10px auto; }
        .on { background: #28a745; }
        .log { font-size: 12px; color: #555; }
        .token { font-size: 12px; background: #e3f2fd; padding: 5px; border-radius: 10px; }
        #btnInstalar { display:none; width:100%; padding:12px; margin-bottom:10px; background:#28a745; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>

<!--<audio id="silentAudio" loop preload="auto" style="display:none;">
   <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>-->

<audio id="silentAudio" loop preload="auto" style="display:none;">
   <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YT1vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT1/" type="audio/wav">
</audio>
    

<!--<audio id="silentAudio" loop preload="auto" style="display:none;">
   <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3" type="audio/mpeg">
</audio>-->
    

<div class="box" id="mainBox">
    <button id="btnInstalar">📲 Instalar App</button>
    <h2>🚗 Motorista</h2>

    <p>Token:</p>
    <div id="token" class="token">...</div>

    <div id="contador" class="contador">0</div>
    <p>Sinais enviados</p>

    <div id="led" class="led"></div>
    <div id="log" class="log">Aguardando toque...</div>
</div>

<script>
// ================= PERSISTÊNCIA (ÁUDIO + WAKE LOCK) =================
const audioSilencioso = document.getElementById('silentAudio');
let wakeLock = null;

const requestLock = async () => {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('💡 Wake Lock Ativo');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
    } catch (err) { /* Falha silenciosa */ }
};

// O "SUPER GATILHO" UNIFICADO
// Força o play imediato e a criação da notificação
async function ativarEscudo() {
    log("⏳ Ativando...");
    
    // 1. Configura a Media Session (Isso é o que força o player a aparecer)
    if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Me Leva - ONLINE',
            artist: 'Rastreamento Ativo',
            album: 'Porto Alegre',
            artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/854/854878.png', sizes: '512x512', type: 'image/png' }]
        });

        // Mantém o player vivo forçando o play se o sistema tentar pausar
        navigator.mediaSession.setActionHandler('play', () => audioSilencioso.play());
        navigator.mediaSession.setActionHandler('pause', () => audioSilencioso.play()); 
    }

    // 2. Tenta tocar o áudio e ativar o Wake Lock
    try {
        audioSilencioso.volume = 0.05; // Volume baixo (5%) para persistência
        await audioSilencioso.play();
        await requestLock();
        
        log("🚀 ONLINE - Player Ativo");
        document.getElementById('mainBox').style.borderColor = "#28a745"; // Feedback visual verde
        
        // Remove ouvintes para não repetir o processo desnecessariamente
        document.removeEventListener('click', ativarEscudo);
        document.removeEventListener('touchstart', ativarEscudo);
    } catch (e) {
        log("⚠️ Erro: Toque novamente");
        console.error(e);
    }
}

// Escuta toque na tela inteira para garantir ativação
document.addEventListener('click', ativarEscudo, { once: true });
document.addEventListener('touchstart', ativarEscudo, { once: true });

// Reativar se o motorista voltar para a aba
document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
        if (audioSilencioso.paused) audioSilencioso.play();
        if (!wakeLock) await requestLock();
        iniciarGPS(); // Garante que o GPS retome ao voltar
    }
});

// ================= CONFIG & WEBHOOK =================
const webhook = "https://primary-production-a103.up.railway.app/webhook/91e80c8e-2309-4dd4-8512-f0dc5c4af856";

const params = new URLSearchParams(window.location.search);
let token = params.get("token") || localStorage.getItem("meleva_token") || "SEM_TOKEN";
if (token !== "SEM_TOKEN") localStorage.setItem("meleva_token", token);
document.getElementById("token").innerText = token;

// ================= UI & LOGS =================
function log(msg) {
    console.log(msg);
    document.getElementById("log").innerText = msg;
}

function blink() {
    const led = document.getElementById("led");
    led.classList.add("on");
    setTimeout(() => led.classList.remove("on"), 500);
}

// ================= LÓGICA DE ENVIO =================
let contador = 0;
let ultimaPosicao = null;
let ultimoEnvio = 0;

async function enviar(lat, lon, speed = 0) {
    const agora = Date.now();
    if (agora - ultimoEnvio < 10000) return; // Trava de 10s
    ultimoEnvio = agora;

    const url = `${webhook}?token=${token}&lat=${lat}&lon=${lon}&speed=${speed || 0}&ping=${contador+1}`;

    try {
        const res = await fetch(url);
        contador++;
        document.getElementById("contador").innerText = contador;
        log("✔ Enviado");
        blink();
    } catch (e) {
        log("❌ Erro de conexão");
    }
}

// ================= GPS =================
function iniciarGPS() {
    if (!navigator.geolocation) {
        log("GPS não suportado");
        return;
    }

    navigator.geolocation.watchPosition(
        (pos) => {
            ultimaPosicao = pos;
            log("📍 GPS OK");
        },
        (err) => { log("Erro GPS: " + err.code); },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
}

// LOOP DE ENVIO (Roda a cada 10s de forma estável)
function loopEnvio() {
    if (ultimaPosicao) {
        const { latitude, longitude, speed } = ultimaPosicao.coords;
        enviar(latitude, longitude, speed);
    } else {
        log("⏳ Aguardando GPS...");
    }
    setTimeout(loopEnvio, 10000);
}

// Início de tudo
iniciarGPS();
loopEnvio();

// Verificação de permissão inicial
navigator.permissions.query({ name: "geolocation" }).then(result => {
    if (result.state === "denied") log("❌ GPS Negado");
});

// ================= INSTALAÇÃO PWA =================
let deferredPrompt;
const btnInstalar = document.getElementById("btnInstalar");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!window.matchMedia('(display-mode: standalone)').matches) {
        btnInstalar.style.display = "block";
    }
});

btnInstalar.addEventListener("click", async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        btnInstalar.style.display = "none";
        deferredPrompt = null;
    }
});

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
