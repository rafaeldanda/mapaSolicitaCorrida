<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me Leva - Motorista</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2ea6ff">

<style>
body {
    font-family: Arial;
    background: #f4f7f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.box {
    background: white;
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    width: 300px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
.contador {
    font-size: 3em;
    color: #2ea6ff;
}
.led {
    width: 12px;
    height: 12px;
    background: #ccc;
    border-radius: 50%;
    margin: 10px auto;
}
.on { background: #28a745; }
.log { font-size: 12px; color: #555; }
.token { font-size: 12px; background: #e3f2fd; padding: 5px; border-radius: 10px; }

#btnInstalar {
    display:none;
    width:100%;
    padding:12px;
    margin-bottom:10px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<button id="btnInstalar">📲 Instalar App</button>

<h2>🚗 Motorista</h2>

<p>Token:</p>
<div id="token" class="token">...</div>

<div id="contador" class="contador">0</div>
<p>Sinais enviados</p>

<div id="led" class="led"></div>
<div id="log" class="log">Iniciando...</div>

</div>

<script>

// ================= CONFIG =================
const webhook = "https://primary-production-a103.up.railway.app/webhook/91e80c8e-2309-4dd4-8512-f0dc5c4af856";

// ================= TOKEN =================
const params = new URLSearchParams(window.location.search);
let token = params.get("token");

if (token) {
    localStorage.setItem("meleva_token", token);
} else {
    token = localStorage.getItem("meleva_token") || "SEM_TOKEN";
}

document.getElementById("token").innerText = token;

// ================= UI =================
function log(msg) {
    console.log(msg);
    document.getElementById("log").innerText = msg;
}

function blink() {
    const led = document.getElementById("led");
    led.classList.add("on");
    setTimeout(() => led.classList.remove("on"), 500);
}

// ================= VARIÁVEIS =================
let contador = 0;
let ultimaPosicao = null;
let ultimoEnvio = 0;

// ================= ENVIO =================
async function enviar(lat, lon, speed = 0) {

    const agora = Date.now();

    // intervalo 10s
    if (agora - ultimoEnvio < 10000) return;

    ultimoEnvio = agora;

    const url = `${webhook}?token=${token}&lat=${lat}&lon=${lon}&speed=${speed || 0}&ping=${contador+1}`;

    try {
        const res = await fetch(url);
        const text = await res.text();

        console.log("Servidor:", text);

        contador++;
        document.getElementById("contador").innerText = contador;

        log("✔ Enviado");
        blink();

    } catch (e) {
        console.error(e);
        log("❌ Erro: " + e.message);
    }
}

// ================= GPS =================
function iniciarGPS() {

    if (!navigator.geolocation) {
        log("GPS não suportado");
        return;
    }

    navigator.geolocation.watchPosition(
        (pos) => {
            ultimaPosicao = pos;

            const { latitude, longitude } = pos.coords;
            console.log("GPS atualizado:", latitude, longitude);

            log("📍 GPS OK");
        },
        (err) => {
            log("Erro GPS: " + err.code);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 20000
        }
    );
}

// ================= LOOP DE ENVIO =================
setInterval(() => {

    if (ultimaPosicao) {
        const { latitude, longitude, speed } = ultimaPosicao.coords;
        enviar(latitude, longitude, speed);
    } else {
        log("⏳ Aguardando GPS...");
    }

}, 10000);

// ================= PERMISSÃO =================
navigator.permissions.query({ name: "geolocation" }).then(result => {

    console.log("Permissão:", result.state);

    if (result.state === "denied") {
        log("❌ Permissão negada");
    } else {
        iniciarGPS();
    }

});

// ================= INSTALAÇÃO PWA =================
let deferredPrompt;
const btnInstalar = document.getElementById("btnInstalar");

function isPWAInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
}

if (isPWAInstalled()) {
    console.log("App já instalado");
} else {
    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstalar.style.display = "block";
    });
}

btnInstalar.addEventListener("click", async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    if (outcome === "accepted") {
        btnInstalar.style.display = "none";
    }

    deferredPrompt = null;
});

window.addEventListener("appinstalled", () => {
    console.log("App instalado");
    btnInstalar.style.display = "none";
});

// ================= SERVICE WORKER =================
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
