<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Painel de Controle</title>
    <style>
        :root { --primary: #2ea6ff; --bg: #f5f7fa; --text: #333; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        .login-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-card h1 { font-size: 20px; color: var(--primary); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { font-size: 11px; color: #aaa; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; background: #fafafa; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: white; }
        
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        #error-msg { color: #ef4444; font-size: 12px; margin-top: 15px; display: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Acesso Restrito</h1>
    
    <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="user" placeholder="Seu usuário">
    </div>
    
    <div class="form-group">
        <label>Senha</label>
        <input type="password" id="pass" placeholder="••••••••">
    </div>
    
    <button id="btn-login" onclick="fazerLogin()">Entrar no Painel</button>
    
    <p id="error-msg">Usuário ou senha incorretos.</p>
</div>

<script>
    async function fazerLogin() {
        const user = document.getElementById('user').value.trim();
        const pass = document.getElementById('pass').value.trim();
        const btn = document.getElementById('btn-login');
        const error = document.getElementById('error-msg');

        if (!user || !pass) {
            error.innerText = "Preencha todos os campos.";
            error.style.display = 'block';
            return;
        }

        try {
            btn.disabled = true;
            btn.innerText = "Verificando...";
            error.style.display = 'none';

            const response = await fetch('https://primary-production-a103.up.railway.app/webhook/fc28663d-1010-4fed-a878-c79b7875b618', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: user, senha: pass })
            });

            if (!response.ok) throw new Error();

            const data = await response.json();
            
            // Verifica se o n8n retornou sucesso (usuário bate com o digitado)
            const userRetornado = Array.isArray(data) ? data[0]?.usuario : data.usuario;

            if (userRetornado === user) {
                // SALVA OS DADOS PARA O PAINEL USAR
                localStorage.setItem('painel_logado', 'true');
                localStorage.setItem('operador_nome', user); // Aqui guardamos o nome do operador!
                
                window.location.href = 'listaContestacao.html';
            } else {
                throw new Error("Credenciais inválidas");
            }

        } catch (e) {
            error.innerText = "Usuário ou senha incorretos.";
            error.style.display = 'block';
            btn.disabled = false;
            btn.innerText = "Entrar no Painel";
        }
    }

    // Permite dar Enter para logar
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') fazerLogin();
    });
</script>

</body>
</html>
